name: bihua
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  path_drawing: ^1.0.1
  flutter_tts: ^4.2.2
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # Light per-char metadata (~435 KB): everything the home page needs.
    - assets/data/chars_index.json
    - assets/data/radicals.json
    # Full stroke payloads, loaded on demand by the detail page.
    - assets/data/shards/
    # Per-char reference data (组词+释义), sharded to match the stroke
    # shards above — the detail page loads only the one shard it needs.
    # words.json / definitions_zh.json stay in the repo as build
    # intermediates (inputs to tools/split_reference_data.py) but are no
    # longer packaged.
    - assets/data/references/
