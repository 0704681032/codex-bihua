name: bihua
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  path_drawing: ^1.0.1
  flutter_tts: ^4.2.2
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # Light per-char metadata (~435 KB): everything the home page needs.
    - assets/data/chars_index.json
    - assets/data/radicals.json
    # Full stroke payloads, loaded on demand by the detail page.
    - assets/data/shards/
    # Detail-page extras (lazy-loaded once, cached by the OS asset cache):
    - assets/data/words.json          # CC-CEDICT derived 组词+pinyin
    - assets/data/definitions_zh.json # 新华字典 derived 中文释义
